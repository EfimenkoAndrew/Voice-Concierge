version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']

  - package-ecosystem: npm
    directory: /src/VoiceConcierge.Ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-patch']
