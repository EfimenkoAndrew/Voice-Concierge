server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # S4-06: defense-in-depth headers. The admin is text-only JSX + a controlled
  # <audio src> (no innerHTML), so there is no current XSS sink — but
  # nosniff + DENY + restrictive CSP closes the door on a future regression
  # and on clickjacking. CSP allows the API origin + LiveKit Cloud (the JS
  # client does an HTTPS settings preflight before opening the wss connection,
  # so both https://*.livekit.cloud and wss: must be allowed).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' http://localhost:8080; connect-src 'self' http://localhost:8080 https://*.livekit.cloud wss://*.livekit.cloud; frame-ancestors 'none'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
